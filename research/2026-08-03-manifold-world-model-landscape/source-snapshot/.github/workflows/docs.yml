name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check reader-facing text
        shell: pwsh
        run: ./scripts/audit/check_reader_text.ps1
      - run: python -m pip install -r requirements-docs.txt
      - run: mkdocs build --strict
